name: Bug report
description: Something doesn't work as documented
body:
  - type: input
    id: board
    attributes:
      label: Board and firmware version
      description: Pico 2 W or Pico W, and the version shown on the settings page
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Deskflow server
      description: OS and Deskflow version, and whether it runs on X11 or Wayland
    validations:
      required: true
  - type: input
    id: laptop
    attributes:
      label: Laptop (the Bluetooth side)
      description: OS and Bluetooth hardware, if you know it
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: From the settings page, around the problem. It has Bluetooth addresses and TLS fingerprints, so look it over first.
      render: text
