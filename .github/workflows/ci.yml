name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: deskflow-proto tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deskflow-proto
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        working-directory: .
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deskflow-proto
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # Includes the TLS handshakes against `openssl s_server` (preinstalled
      # on the runner).
      - name: Tests
        run: cargo test
      - name: Keyboard layouts are up to date
        working-directory: .
        run: |
          python3 tools/gen_layouts.py --out "$RUNNER_TEMP/layouts.rs"
          diff -u deskflow-proto/src/layouts.rs "$RUNNER_TEMP/layouts.rs"

  tls-offload:
    name: core-1 TLS offload (host)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/tls-offload-test
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        working-directory: .
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/tls-offload-test
      # Runs firmware/src/tls_offload.rs with a thread as core 1, against
      # `openssl s_server`.
      - name: Sessions, stop/restart, failures
        run: cargo run --release

  firmware:
    name: firmware + UF2 (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pico2-w
            target: thumbv8m.main-none-eabihf
            cargo-args: ""
          - board: pico-w
            target: thumbv6m-none-eabi
            cargo-args: --target thumbv6m-none-eabi --no-default-features --features pico-w
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rust-src --target ${{ matrix.target }}
      - name: libudev (for elf2uf2-rs)
        if: matrix.board == 'pico-w'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
          key: ${{ matrix.board }}
      - name: flip-link
        run: cargo install --locked flip-link@0.1.12
      - name: Clippy
        working-directory: firmware
        run: cargo clippy --release ${{ matrix.cargo-args }} -- -D warnings
      - name: Clippy (bootloader)
        if: matrix.board == 'pico2-w'
        working-directory: bootloader
        run: cargo clippy --release -- -D warnings
      - name: Build UF2
        run: ./scripts/uf2.sh ${{ matrix.board }}
      # scripts/elf2uf2.py replaces elf2uf2-rs (which can't do the RP2350);
      # for the RP2040 its output must match elf2uf2-rs byte for byte.
      - name: UF2 converter matches elf2uf2-rs
        if: matrix.board == 'pico-w'
        run: |
          cargo install --locked elf2uf2-rs@2.2.0
          elf2uf2-rs firmware/target/thumbv6m-none-eabi/release/pico-deskflow-bridge reference.uf2
          cmp reference.uf2 pico-deskflow-bridge-pico-w.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: pico-deskflow-bridge-${{ matrix.board }}-uf2
          path: pico-deskflow-bridge-${{ matrix.board }}*.uf2
          if-no-files-found: error

  # Pushing a tag like v0.1.0 publishes the UF2s from this run as a release.
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, tls-offload, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: uf2
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l uf2
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" uf2/*.uf2 $pre \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # Uploads the UF2s to Cloudflare R2, under pico-deskflow-bridge/:
  #   snapshot/          every push to main; overwritten by the next one
  #   releases/<tag>/    a v* tag; kept
  #   releases/latest/   the newest v* tag without a "-" suffix (not a prerelease)
  # Needs vars.R2_BUCKET and vars.R2_ENDPOINT and the secrets R2_ACCESS_KEY_ID
  # and R2_SECRET_ACCESS_KEY, as in the other repos.
  publish-r2:
    name: Publish UF2s to R2
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [host, tls-offload, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Two pushes in a row shouldn't interleave their uploads.
    concurrency:
      group: publish-r2-${{ github.ref }}
      cancel-in-progress: false
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - name: Validate R2 configuration
        run: |
          if [ -z "${R2_BUCKET}" ] || [ -z "${R2_ENDPOINT}" ]; then
            echo "::error::vars.R2_BUCKET and vars.R2_ENDPOINT must be set in this repository's Actions settings (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: uf2
          merge-multiple: true
      - name: Checksums and version
        working-directory: uf2
        run: |
          sha256sum *.uf2 | tee sha256sums.txt
          if [ "${GITHUB_REF_TYPE}" = tag ]; then name="${GITHUB_REF_NAME}"; else name="snapshot of main"; fi
          printf '%s\ncommit %s\nbuilt %s\n' "${name}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee version.txt
      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          put() { # <file> <prefix> <cache-control>
            aws s3 cp "$1" "s3://${R2_BUCKET}/pico-deskflow-bridge/$2/$(basename "$1")" \
              --endpoint-url "${R2_ENDPOINT}" --cache-control "$3"
          }
          for f in uf2/*.uf2 uf2/sha256sums.txt uf2/version.txt; do
            if [ "${GITHUB_REF_TYPE}" = tag ]; then
              put "$f" "releases/${GITHUB_REF_NAME}" "public, max-age=31536000, immutable"
              case "${GITHUB_REF_NAME}" in
                *-*) ;;  # a prerelease doesn't become "latest"
                *) put "$f" releases/latest "no-cache" ;;
              esac
            else
              put "$f" snapshot "no-cache"
            fi
          done
      - name: Summary
        run: |
          {
            echo "### Published to R2 :package:"
            echo ""
            cat uf2/version.txt
            echo ""
            echo "Files:"
            for f in uf2/*; do echo "- $(basename "$f")"; done
            echo ""
            echo '```'
            cat uf2/sha256sums.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
