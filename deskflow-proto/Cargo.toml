[package]
name = "deskflow-proto"
version = "0.1.0"
edition = "2024"
description = "no_std Deskflow (Synergy-compatible) client protocol codec and HID report mapping"
license = "MIT"
repository = "https://github.com/N0t4R0b0t/pico-deskflow-bridge"
publish = false

[dependencies]
# TLS 1.3 client pieces (see `tls`). Versions follow embedded-tls 0.19, which
# is built on the same RustCrypto releases.
embedded-tls = { version = "0.19", default-features = false }
heapless = "0.9"
hmac = "0.12"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "sha256"] }
rand_core = { version = "0.6", default-features = false }
rsa = { version = "0.9.9", default-features = false, features = ["sha2"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
embedded-io-adapters = { version = "0.7", features = ["std"] }
embedded-tls = { version = "0.19", default-features = false, features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
